name: Build Portable Windows EXEs (10 websites)

on:
  push:
    branches:
      - feature/portable-exe-all-sites
    paths:
      - portable/**
      - tools/portable_launcher.py
      - tools/build_portable.py
      - tools/clone_runtime.py
      - tools/thai_runtime.py
      - tools/moon_runtime.py
      - tools/esp_labs_runtime.py
      - tests/test_portable_exe.py
      - .github/workflows/build-portable-exes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate portable implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable tests (no vendor assets)
        run: python -m unittest discover -s tests -p test_portable_exe.py -v

  build:
    name: EXE · ${{ matrix.project }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - ESP32
          - Arduino
          - RoverKit
          - Multimeter
          - Protocol
          - DesignedToScale
          - RoboticsLab
          - ByteSizedAlgorithms
          - MoonLife
          - ESP32Labs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Windows one-file build tool
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build bootstrap EXE (original assets not bundled)
        shell: pwsh
        run: python tools/build_portable.py --site "${{ matrix.project }}" --mode bootstrap
      - name: Smoke-test the actual frozen EXE (offline, no vendor assets)
        shell: pwsh
        run: |
          $project = "${{ matrix.project }}"
          $exe = (Get-ChildItem "dist/portable/*.exe" | Select-Object -First 1).FullName
          $output = Join-Path $env:RUNNER_TEMP ("portable-smoke-" + $project + ".json")
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test-output `"$output`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE failed startup smoke-test: $project (exit $($process.ExitCode))" }
          if (-not (Test-Path -LiteralPath $output)) { throw "EXE created no self-test output: $project" }
          $result = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen -or $result.project -ne $project -or $result.mode -ne "bootstrap") {
            throw "EXE identity/resources mismatch: $project $($result | ConvertTo-Json -Compress)"
          }
          if ($result.missing.Count -ne 0) { throw "EXE missing bundled resources: $project" }
          Write-Host "PASS: frozen EXE starts, selects $project and loads packaged resources."
      - name: Upload standalone Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SimulationLearning-${{ matrix.project }}-Portable-EXE
          path: dist/portable/*.exe
          if-no-files-found: error
          retention-days: 14
