name: Clean up superseded SimulationLearning branches

on:
  workflow_run:
    workflows: ["Build Portable Windows EXEs (10 websites)"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    name: Consolidate branch history into main
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only branches whose commits are included in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for branch in 'feature/portable-exe-all-sites' 'develop/v1.1.0'; do
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "$branch already absent"
              continue
            fi
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if git merge-base --is-ancestor "origin/$branch" "origin/main"; then
              git push origin --delete "$branch"
              echo "Deleted $branch (fully merged into main)"
            else
              echo "KEEPING $branch: it contains commits not merged into main"
            fi
          done
